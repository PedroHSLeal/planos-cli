name: build

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx tsc
      - run: bun test

  # `bun build --compile` targets the runner's platform, and @opentui/core ships
  # platform-specific native binaries, so each platform builds on its own runner.
  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The build inlines env vars into the executable. Only the OAuth client goes in
      # (Google treats desktop-app client secrets as non-confidential); never add a
      # refresh or access token here, it would ship to everyone who downloads the binary.
      - run: bun run build
        env:
          PLANOS_GOOGLE_CLIENT_ID: ${{ secrets.PLANOS_GOOGLE_CLIENT_ID }}
          PLANOS_GOOGLE_CLIENT_SECRET: ${{ secrets.PLANOS_GOOGLE_CLIENT_SECRET }}
      - name: Rename executable for ${{ matrix.target }}
        shell: bash
        run: |
          mkdir dist
          if [ -f planos.exe ]; then
            mv planos.exe "dist/planos-${{ matrix.target }}.exe"
          else
            mv planos "dist/planos-${{ matrix.target }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: planos-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          tag="v${version}-build.${{ github.run_number }}"
          gh release create "$tag" dist/* \
            --target "${{ github.sha }}" \
            --title "planos $tag" \
            --notes "Automated build of ${{ github.sha }} from master." \
            --latest
